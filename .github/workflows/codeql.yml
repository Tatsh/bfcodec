---
env:
  CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
jobs:
  analyze:
    name: analyse
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: matrix.language == 'c-cpp'
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-dev libspdlog-dev libssl-dev libzip-dev nlohmann-json3-dev zipcmp zipmerge ziptool
      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9
        with:
          category: /language:${{matrix.language}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: autobuild
            language: c-cpp
          - build-mode: none
            language: actions
name: CodeQL
'on':
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
  schedule:
    - cron: 42 10 * * 4
