---
env:
  CODEQL_EXTRACTOR_CPP_AUTOINSTALL_DEPENDENCIES: 'false'
jobs:
  analyze:
    name: analyse
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - if: matrix.language == 'c-cpp'
        name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-dev libspdlog-dev libssl-dev libzip-dev nlohmann-json3-dev zipcmp zipmerge ziptool
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          build-mode: ${{ matrix.build-mode }}
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81
        with:
          category: /language:${{matrix.language}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build-mode: autobuild
            language: c-cpp
          - build-mode: none
            language: actions
name: CodeQL
'on':
  pull_request:
    branches: ['master']
  push:
    branches: ['master']
  schedule:
    - cron: 42 10 * * 4
