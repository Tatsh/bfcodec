---
jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install deps
        run: brew install libplist libzip spdlog
      - run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} \
            --install-prefix ${{github.workspace}}/build/prefix
          cmake --build build --config ${{matrix.build-type}} --verbose
          cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v7'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-${{ matrix.os }}
          path: |
            ${{github.workspace}}/bfcodec-*.zip
            ${{github.workspace}}/bfcodec-*.dmg
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.zip
            ${{github.workspace}}/bfcodec-*.dmg
      - if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.zip
            ${{github.workspace}}/bfcodec-*.dmg
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os: [macos-latest, macos-15-intel]
  build-msys:
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@v2
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            libplist:p
            libzip:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            spdlog:p
            toolchain:p
            zlib:p
          update: true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure
        run: >-
          cmake -G Ninja -B ${{steps.fixed_workspace.outputs.out}}/build
          --install-prefix ${{steps.fixed_workspace.outputs.out}}/build/prefix
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DCPACK_SYSTEM_NAME=${{matrix.sys.cpack_system}}
        shell: msys2 {0}
      - name: Build
        run: cmake --build ${{steps.fixed_workspace.outputs.out}}/build --verbose
        shell: msys2 {0}
      - name: Install
        run: >-
          cmake --install ${{steps.fixed_workspace.outputs.out}}/build
          --config ${{matrix.build-type}} --verbose
        shell: msys2 {0}
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{steps.fixed_workspace.outputs.out}}/build/CPackConfig.cmake --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v7'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' && matrix.sys.release }}
        name: Upload package
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: true
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: true
            runner: windows-11-arm
  build-msvc:
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git ${{steps.fixed_workspace.outputs.out}}/vcpkg
      - name: Bootstrap vcpkg
        run: ${{steps.fixed_workspace.outputs.out}}/vcpkg/bootstrap-vcpkg.bat
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        run: >-
          cmake -G "Visual Studio 17 2022" -A ${{matrix.sys.cmake_arch}}
          -B ${{steps.fixed_workspace.outputs.out}}/build
          -DCMAKE_TOOLCHAIN_FILE=${{steps.fixed_workspace.outputs.out}}/vcpkg/scripts/buildsystems/vcpkg.cmake
          --install-prefix ${{steps.fixed_workspace.outputs.out}}/build/prefix
          -DCPACK_SYSTEM_NAME=msvc-${{matrix.sys.arch}}
      - name: Build
        run: cmake --build ${{steps.fixed_workspace.outputs.out}}/build --config ${{matrix.build-type}} --verbose
      - name: Install
        run: >-
          cmake --install ${{steps.fixed_workspace.outputs.out}}/build
          --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{steps.fixed_workspace.outputs.out}}/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v7'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-msvc-${{ matrix.sys.arch }}
          path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - arch: x64
            cmake_arch: x64
            runner: windows-latest
          - arch: arm64
            cmake_arch: ARM64
            runner: windows-11-arm
  build-linux:
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-dev libspdlog-dev libssl-dev libzip-dev tree zipcmp zipmerge ziptool
      - name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build
          --install-prefix ${{github.workspace}}/build/AppDir/usr
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose --config ${{matrix.build-type}}
      - name: Install
        run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: Create AppImage
        env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage"
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" \
            --appdir ${{github.workspace}}/build/AppDir \
            --executable ${{github.workspace}}/build/AppDir/usr/bin/jbt \
            --desktop-file ${{github.workspace}}/data/sh.tat.bfcodec.desktop \
            --icon-file ${{github.workspace}}/data/sh.tat.bfcodec.svg \
            --output appimage
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage"
          mv -v ${{github.workspace}}/*.AppImage "${{github.workspace}}/bfcodec-${{matrix.build-type}}-${DEPLOY_ARCH}.AppImage"
      - if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: mv -v ${{github.workspace}}/bfcodec-*.AppImage ${{github.workspace}}/bfcodec-${{github.ref_name}}-${{matrix.arch.deploy_arch}}.AppImage
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v7'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/bfcodec-*.AppImage
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.AppImage
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.AppImage
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  attestations: write
  contents: write
  id-token: write
