---
jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install deps
        run: brew install libplist libzip nlohmann-json spdlog
      - env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            --install-prefix "$GITHUB_WORKSPACE/build/prefix"
          cmake --build build --config "$BUILD_TYPE" --verbose
          cmake --install "$GITHUB_WORKSPACE/build" --config "$BUILD_TYPE" --verbose
      - name: Package
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: >-
          cpack -C "$BUILD_TYPE"
          --config "$GITHUB_WORKSPACE/build/CPackConfig.cmake" --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-${{ matrix.os }}
          path: |
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" --draft --title "$REF_NAME" --notes '' --verify-tag || true
          gh release upload "$REF_NAME" bfcodec-*.zip --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os: [macos-latest, macos-15-intel]
  build-msys:
    runs-on: ${{ matrix.sys.runner }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            libplist:p
            libzip:p
            ninja:p
            nlohmann-json:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            spdlog:p
            toolchain:p
            zlib:p
          update: true
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          CPACK_SYSTEM: ${{ matrix.sys.cpack_system }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: >-
          cmake -G Ninja -B "$OUT/build"
          --install-prefix "$OUT/build/prefix"
          -DCMAKE_BUILD_TYPE="$BUILD_TYPE"
          -DCPACK_SYSTEM_NAME="$CPACK_SYSTEM"
        shell: msys2 {0}
      - name: Build
        env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: cmake --build "$OUT/build" --verbose
        shell: msys2 {0}
      - name: Install
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: >-
          cmake --install "$OUT/build"
          --config "$BUILD_TYPE" --verbose
        shell: msys2 {0}
      - name: Package
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: >-
          cpack -C "$BUILD_TYPE"
          --config "$OUT/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' && matrix.sys.release }}
        name: Upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" --draft --title "$REF_NAME" --notes '' --verify-tag || true
          gh release upload "$REF_NAME" bfcodec-*.exe bfcodec-*.zip --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            name: ucrt64
            release: true
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            name: clangarm64
            release: true
            runner: windows-11-arm
  build-msvc:
    runs-on: ${{ matrix.sys.runner }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Clone vcpkg
        env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: git clone https://github.com/microsoft/vcpkg.git "$env:OUT/vcpkg"
      - name: Bootstrap vcpkg
        env:
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: '& "$env:OUT/vcpkg/bootstrap-vcpkg.bat"'
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Configure
        env:
          ARCH: ${{ matrix.sys.arch }}
          CMAKE_ARCH: ${{ matrix.sys.cmake_arch }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: >-
          cmake -A "$env:CMAKE_ARCH"
          -B "$env:OUT/build"
          -DCMAKE_TOOLCHAIN_FILE="$env:OUT/vcpkg/scripts/buildsystems/vcpkg.cmake"
          --install-prefix "$env:OUT/build/prefix"
          -DCPACK_SYSTEM_NAME="msvc-$env:ARCH"
      - name: Build
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: cmake --build "$env:OUT/build" --config "$env:BUILD_TYPE" --verbose
      - name: Install
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: >-
          cmake --install "$env:OUT/build"
          --config "$env:BUILD_TYPE" --verbose
      - name: Package
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          OUT: ${{ steps.fixed_workspace.outputs.out }}
        run: >-
          cpack -C "$env:BUILD_TYPE"
          --config "$env:OUT/build/CPackConfig.cmake" --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-msvc-${{ matrix.sys.arch }}
          path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" --draft --title "$REF_NAME" --notes '' --verify-tag || true
          gh release upload "$REF_NAME" bfcodec-*.exe bfcodec-*.zip --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - arch: x64
            cmake_arch: x64
            runner: windows-latest
          - arch: arm64
            cmake_arch: ARM64
            runner: windows-11-arm
  build-linux:
    runs-on: ${{ matrix.arch.runner }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-dev libspdlog-dev libssl-dev libzip-dev nlohmann-json3-dev tree zipcmp zipmerge ziptool
      - name: Configure
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: >-
          cmake -DCMAKE_BUILD_TYPE="$BUILD_TYPE" -B "$GITHUB_WORKSPACE/build"
          --install-prefix "$GITHUB_WORKSPACE/build/AppDir/usr"
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - name: Build
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: cmake --build "$GITHUB_WORKSPACE/build" --verbose --config "$BUILD_TYPE"
      - name: Install
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: cmake --install "$GITHUB_WORKSPACE/build" --config "$BUILD_TYPE" --verbose
      - name: Package
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
        run: >-
          cpack -C "$BUILD_TYPE"
          --config "$GITHUB_WORKSPACE/build/CPackConfig.cmake" --verbose
      - name: Create AppImage
        env:
          BUILD_TYPE: ${{ matrix.build-type }}
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
        run: |
          wget "https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-${DEPLOY_ARCH}.AppImage"
          chmod +x "linuxdeploy-${DEPLOY_ARCH}.AppImage"
          "./linuxdeploy-${DEPLOY_ARCH}.AppImage" \
            --appdir "$GITHUB_WORKSPACE/build/AppDir" \
            --executable "$GITHUB_WORKSPACE/build/AppDir/usr/bin/jbt" \
            --desktop-file "$GITHUB_WORKSPACE/data/sh.tat.bfcodec.desktop" \
            --icon-file "$GITHUB_WORKSPACE/data/sh.tat.bfcodec.svg" \
            --output appimage
          rm "./linuxdeploy-${DEPLOY_ARCH}.AppImage"
          mv -v "$GITHUB_WORKSPACE"/*.AppImage "$GITHUB_WORKSPACE/bfcodec-${BUILD_TYPE}-${DEPLOY_ARCH}.AppImage"
      - if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        env:
          DEPLOY_ARCH: ${{ matrix.arch.deploy_arch }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          mv -v "${GITHUB_WORKSPACE}"/bfcodec-*.AppImage
          "${GITHUB_WORKSPACE}/bfcodec-${REF_NAME}-${DEPLOY_ARCH}.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-Linux-${{ matrix.arch.deploy_arch }}
          path: |
            ${{github.workspace}}/bfcodec-*.AppImage
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.AppImage
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$REF_NAME" --draft --title "$REF_NAME" --notes '' --verify-tag || true
          gh release upload "$REF_NAME" bfcodec-*.AppImage --clobber
    strategy:
      fail-fast: false
      matrix:
        arch:
          - deploy_arch: aarch64
            runner: ubuntu-24.04-arm
          - deploy_arch: x86_64
            runner: ubuntu-latest
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  contents: read
