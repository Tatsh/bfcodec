---
jobs:
  build-macos:
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install deps
        run: brew install libzip spdlog
      - run: |
          cmake -G Ninja -B build -DCMAKE_BUILD_TYPE=${{matrix.build-type}} \
            --install-prefix ${{github.workspace}}/build/prefix
          cmake --build build --config ${{matrix.build-type}} --verbose
          cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v6'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-${{ matrix.os }}
          path: |
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os: [macos-latest, macos-15-intel]
  build-msys:
    runs-on: windows-latest
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: msys2/setup-msys2@v2
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            ninja:p
            nsis:p
            toolchain:p
            libplist:p
            libzip:p
            spdlog:p
          update: true
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure
        run: >-
          cmake -G Ninja -B ${{steps.fixed_workspace.outputs.out}}/build
          --install-prefix ${{steps.fixed_workspace.outputs.out}}/build/prefix
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
        shell: msys2 {0}
      - name: Build
        run: cmake --build ${{steps.fixed_workspace.outputs.out}}/build --verbose
        shell: msys2 {0}
      - name: Install
        run: >-
          cmake --install ${{steps.fixed_workspace.outputs.out}}/build
          --config ${{matrix.build-type}} --verbose
        shell: msys2 {0}
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{steps.fixed_workspace.outputs.out}}/build/CPackConfig.cmake --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v6'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' && matrix.sys.name == 'ucrt64' }}
        name: Upload package
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - env: x86_64
            name: mingw64
          - env: ucrt-x86_64
            name: ucrt64
  build-msvc:
    runs-on: windows-latest
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Clone vcpkg
        run: git clone https://github.com/microsoft/vcpkg.git ${{ steps.fixed_workspace.outputs.out }}/vcpkg
      - name: Bootstrap vcpkg
        run: ${{ steps.fixed_workspace.outputs.out }}/vcpkg/bootstrap-vcpkg.bat
      - name: Install NSIS
        run: choco install nsis -y
      - name: Configure
        run: >-
          cmake -G "Visual Studio 17 2022" -A x64
          -B ${{ steps.fixed_workspace.outputs.out }}/build
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.fixed_workspace.outputs.out }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          --install-prefix ${{ steps.fixed_workspace.outputs.out }}/build/prefix
      - name: Build
        run: cmake --build ${{ steps.fixed_workspace.outputs.out }}/build --config ${{ matrix.build-type }} --verbose
      - name: Install
        run: >-
          cmake --install ${{ steps.fixed_workspace.outputs.out }}/build
          --config ${{ matrix.build-type }} --verbose
      - name: Get project version
        id: version
        run: |
          $content = Get-Content "${{ steps.fixed_workspace.outputs.out }}/CMakeLists.txt" -Raw
          $m = [regex]::Match($content, 'project\s*\([^)]*VERSION\s+([\d.]+)')
          $version = if ($m.Success) { $m.Groups[1].Value } else { '0.0.0' }
          echo "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package
        run: >-
          cpack -C ${{ matrix.build-type }}
          -D CPACK_PACKAGE_FILE_NAME=bfcodec-${{ steps.version.outputs.version }}-msvc64-${{ matrix.build-type }}
          --config ${{ steps.fixed_workspace.outputs.out }}/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v6'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-msvc-win64
          path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
      - if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ${{github.workspace}}/bfcodec-*.exe
            ${{github.workspace}}/bfcodec-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libplist-dev libspdlog-dev libssl-dev libzip-dev zipcmp zipmerge ziptool
      - name: Configure
        run: >-
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build
          --install-prefix ${{github.workspace}}/build/AppDir/usr
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --verbose --config ${{matrix.build-type}}
      - name: Install
        run: cmake --install ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake --verbose
      # - name: Create AppImage
      #   run: |
      #     wget 'https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'
      #     chmod +x linuxdeploy-x86_64.AppImage
      #     ./linuxdeploy-x86_64.AppImage --appdir ${{github.workspace}}/build/AppDir --output appimage
      #     rm ./linuxdeploy-x86_64.AppImage
      #     mv -v ${{github.workspace}}/*.AppImage ${{github.workspace}}/bfcodec-${{matrix.build-type}}-x86_64.AppImage
      # - if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
      #   name: Rename with tag
      #   run: mv -v ${{github.workspace}}/bfcodec-*.AppImage ${{github.workspace}}/bfcodec-${{github.ref_name}}-x86_64.AppImage
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@v6'
        with:
          if-no-files-found: error
          name: bfcodec-${{ matrix.build-type }}-Linux
          path: |
            ${{github.workspace}}/bfcodec-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            ${{github.workspace}}/bfcodec-*.zip
      # - if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
      #   name: Upload package
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     fail_on_unmatched_files: true
      #     files: |
      #       ${{github.workspace}}/build/bfcodec-*.AppImage
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
name: C/C++ CI
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  attestations: write
  contents: write
  id-token: write
